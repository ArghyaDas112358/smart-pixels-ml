# pytest.ini
[pytest]
testpaths = tests
addopts = -ra -q
; Register custom markers to remove PytestUnknownMarkWarning
markers =
    timeout: Mark a test as having a timeout (requires pytest-timeout)

; Filter out specific warning types to clean up output
filterwarnings =
    ; Ignore TensorFlow's internal use of deprecated 'distutils'
    ignore:distutils Version classes are deprecated:DeprecationWarning:tensorflow
    ignore:distutils Version classes are deprecated:DeprecationWarning:tensorflow_model_optimization
    ignore:distutils Version classes are deprecated:DeprecationWarning:tensorflow_probability
